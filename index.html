<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Call Transcriber</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#667;--bd:#d5d9de;--g:#1b8a3a;--r:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#15181c;--card:#20252b;--tx:#eee;--mut:#9aa;--bd:#38404a}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px}h1{font-size:20px;margin:0 0 4px}
.s{color:var(--mut);font-size:13px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
input,select,button{font-size:16px;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input,select{width:100%;box-sizing:border-box;margin-bottom:8px}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1}button{font-weight:600}
#join{background:var(--g);color:#fff;border:0;width:100%}#leave{background:var(--r);color:#fff;border:0}
#mute.on{background:#f5a623;color:#000}#log{height:42vh;overflow:auto}
.l{margin-bottom:8px}.t{color:var(--mut);font-size:12px;margin-right:6px}
.p{display:inline-block;padding:3px 9px;margin:2px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);font-size:13px}
.p.sp{border-color:var(--g);color:var(--g);font-weight:700}#st{font-size:13px;color:var(--mut);margin:6px 0}
</style></head><body><div class="w">
<h1>Team Call Transcriber</h1>
<div class="s">Voice call for up to 15 people. Each person's own voice is typed automatically with their name.</div>
<div class="c" id="lobby">
 <input id="nm" placeholder="Your name" maxlength="30">
 <input id="room" placeholder="Room name (same for everyone)" value="team" maxlength="40">
 <input id="pass" type="password" placeholder="Passcode" hidden>
 <select id="lang"><option value="ta-IN">Tamil (English words allowed)</option><option value="en-IN">English (India)</option></select>
 <button id="join">Join call</button><div id="err" class="s" style="color:var(--r)"></div>
 <div class="s">Use headphones, so your microphone does not pick up other people's voices.</div>
</div>
<div id="call" hidden>
 <div class="c"><div id="who"></div><div id="st"></div>
  <div class="r"><button id="mute">Mute mic</button><button id="leave">Leave</button></div></div>
 <div class="c" id="log"></div>
 <div class="r"><button id="xls">Save Excel</button><button id="doc">Save Word</button></div>
</div><div id="audio"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let ws,me,myName,room,pass='',ICE=[],stream,rec,running=false,muted=false;
const pcs={},names={},speaking={};

fetch('/ice').then(r=>r.json()).then(j=>{ICE=j.iceServers;if(j.passcode)$('pass').hidden=false;}).catch(()=>{});
const q=new URLSearchParams(location.search);if(q.get('room'))$('room').value=q.get('room');

function renderWho(){
 const all=[[me,myName+' (you)'],...Object.entries(names)];
 $('who').innerHTML=all.map(([p,n])=>`<span class="p ${speaking[p]?'sp':''}">${esc(n)}</span>`).join('');
 $('st').textContent=all.length+' in call';
}
function addLine(l){
 const d=document.createElement('div');d.className='l';
 d.innerHTML='<span class="t"></span><b></b> <span></span>';
 d.children[0].textContent=l.time;d.children[1].textContent=l.name+':';d.children[2].textContent=l.text;
 $('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;
}
const sig=(to,kind,payload)=>ws.send(JSON.stringify({type:'sig',to,kind,payload}));

function mkPc(peer,initiator){
 if(pcs[peer])return pcs[peer];
 const pc=new RTCPeerConnection({iceServers:ICE});pcs[peer]=pc;
 stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.onicecandidate=e=>{if(e.candidate)sig(peer,'ice',e.candidate.toJSON());};
 pc.ontrack=e=>{let a=document.getElementById('a'+peer);
  if(!a){a=document.createElement('audio');a.id='a'+peer;a.autoplay=true;a.playsInline=true;$('audio').appendChild(a);}
  a.srcObject=e.streams[0];};
 if(initiator)pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sig(peer,'offer',pc.localDescription.toJSON()));
 return pc;
}
function drop(p){if(pcs[p]){try{pcs[p].close()}catch(_){}delete pcs[p];}
 const a=document.getElementById('a'+p);if(a)a.remove();delete names[p];renderWho();}

function startRec(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('st').textContent='Voice typing needs Google Chrome. Call audio still works.';return;}
 rec=new SR();rec.lang=$('lang').value;rec.continuous=true;rec.interimResults=false;
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){
  if(!e.results[i].isFinal||muted)continue;
  const text=e.results[i][0].transcript.trim();
  if(text&&ws.readyState===1)ws.send(JSON.stringify({type:'line',text}));}};
 rec.onend=()=>{if(running)try{rec.start()}catch(_){}};
 try{rec.start()}catch(_){}
}

$('join').onclick=async()=>{
 myName=$('nm').value.trim();room=$('room').value.trim()||'team';pass=$('pass').value;
 if(!myName){$('nm').focus();return;}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
 catch(_){$('err').textContent='Please allow the microphone.';return;}
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>ws.send(JSON.stringify({type:'join',room,name:myName,pass}));
 ws.onmessage=async ev=>{const m=JSON.parse(ev.data);
  if(m.type==='error'){$('err').textContent=m.msg;stream.getTracks().forEach(t=>t.stop());ws.close();return;}
  if(m.type==='welcome'){me=m.id;m.peers.forEach(p=>names[p.id]=p.name);
   $('lobby').hidden=true;$('call').hidden=false;m.lines.forEach(addLine);running=true;startRec();renderWho();}
  else if(m.type==='peer-join'){names[m.id]=m.name;renderWho();mkPc(m.id,true);}
  else if(m.type==='peer-left')drop(m.id);
  else if(m.type==='line'){addLine(m);speaking[m.id]=true;renderWho();setTimeout(()=>{speaking[m.id]=false;renderWho();},1500);}
  else if(m.type==='sig'){const pc=mkPc(m.from,false);
   try{if(m.kind==='offer'){await pc.setRemoteDescription(m.payload);const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(m.from,'answer',pc.localDescription.toJSON());}
   else if(m.kind==='answer')await pc.setRemoteDescription(m.payload);
   else if(m.kind==='ice')await pc.addIceCandidate(m.payload);}catch(_){}}
 };
 ws.onclose=()=>{if(running)$('st').textContent='Connection lost. Reload the page to rejoin.';};
};
$('mute').onclick=()=>{muted=!muted;stream.getAudioTracks().forEach(t=>t.enabled=!muted);
 $('mute').textContent=muted?'Unmute mic':'Mute mic';$('mute').classList.toggle('on',muted);};
$('leave').onclick=()=>{running=false;try{rec&&rec.stop()}catch(_){}Object.keys(pcs).forEach(drop);
 stream.getTracks().forEach(t=>t.stop());ws.close();$('st').textContent='You left. You can still save the transcript.';
 $('leave').disabled=true;$('mute').disabled=true;};
const dlurl=f=>`/export?room=${encodeURIComponent(room)}&fmt=${f}&key=${encodeURIComponent(pass)}`;
$('xls').onclick=()=>location.href=dlurl('xls');
$('doc').onclick=()=>location.href=dlurl('doc');
</script></body></html>
