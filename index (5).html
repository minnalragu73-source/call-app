<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Call Transcriber</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#111;--mut:#667;--bd:#d5d9de;--g:#1b8a3a;--r:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#15181c;--card:#20252b;--tx:#eee;--mut:#9aa;--bd:#38404a}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px}h1{font-size:20px;margin:0 0 4px}
.s{color:var(--mut);font-size:13px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
input,select,button{font-size:16px;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input,select{width:100%;box-sizing:border-box;margin-bottom:8px}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1}button{font-weight:600}
#join{background:var(--g);color:#fff;border:0;width:100%}#leave{background:var(--r);color:#fff;border:0}
#mute.on{background:#f5a623;color:#000}#log{height:42vh;overflow:auto}
.l{margin-bottom:8px}.t{color:var(--mut);font-size:12px;margin-right:6px}
.p{display:inline-block;padding:3px 9px;margin:2px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);font-size:13px}
.p.sp{border-color:var(--g);color:var(--g);font-weight:700}#st{font-size:13px;color:var(--mut);margin:6px 0}
.o{color:var(--mut);font-size:13px;margin:2px 0 0 4px}
html,body{overflow-x:hidden}.w,.c,.l,.o,#log{max-width:100%;box-sizing:border-box;overflow-wrap:anywhere;word-break:break-word}
.cd{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin:4px 0 0 4px;font-size:13px;line-height:1.5}
table.dt{border-collapse:collapse;font-size:13px;min-width:900px}table.dt td,table.dt th{border:1px solid var(--bd);padding:4px 6px;vertical-align:top;text-align:left}
.dw{overflow-x:auto}.dt select,.dt input{font-size:13px;padding:4px;width:auto;margin:0}.f-ok{color:var(--g);font-weight:700}.f-bad{color:var(--r);font-weight:700}
</style></head><body><div class="w">
<h1>Team Call Transcriber</h1>
<div class="s">Voice call for up to 15 people. Speak in any language: everyone reads clear, corrected English.</div>
<div class="c" id="lobby">
 <input id="nm" placeholder="Your name" maxlength="30">
 <input id="room" placeholder="Room name (same for everyone)" value="team" maxlength="40">
 <input id="pass" type="password" placeholder="Passcode" hidden>
 <select id="lang"><option value="ta">Tamil + English mixed</option><option value="en">English only</option><option value="auto">Other language (auto detect)</option></select>
 <button id="join">Join call</button><div id="err" class="s" style="color:var(--r)"></div>
 <div class="s">Use headphones, so your microphone does not pick up other people's voices.</div>
</div>
<div id="call" hidden>
 <div class="c"><div id="who"></div><div id="st"></div><div id="vs" class="s"></div>
  <div class="r"><button id="mute">Mute mic</button><button id="leave">Leave</button></div></div>
 <div class="c" id="log"></div>
<div class="c" id="sap"><b>SAP data</b> <span id="sapst" class="s"></span>
  <div class="r" style="margin-top:6px"><button id="uo">Upload Orders / SO / Stock report</button><button id="uw">Upload WIP status report</button></div>
  <input type="file" id="fo" accept=".xlsx,.xls" hidden><input type="file" id="fw" accept=".xlsx,.xls" hidden>
  <div class="r" style="margin-top:8px"><input id="pq" placeholder="Type a part number" style="margin:0"><button id="pl">Look up</button></div>
  <div id="pc"></div>
 </div>
 <div class="r" style="margin-bottom:10px"><button id="de0">Day-end check</button></div>
 <div class="c" id="dec" hidden><div class="dw" id="de"></div><div class="r" style="margin-top:8px"><button id="dx">Save day-end Excel</button></div></div>
 <div class="r"><button id="xls">Save Excel</button><button id="doc">Save Word</button></div>
</div><div id="audio"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let ws,me,myName,room,pass='',ICE=[],stream,rec,running=false,muted=false;
const pcs={},names={},speaking={};

fetch('/ice').then(r=>r.json()).then(j=>{ICE=j.iceServers;if(j.passcode)$('pass').hidden=false;}).catch(()=>{});
const q=new URLSearchParams(location.search);if(q.get('room'))$('room').value=q.get('room');

function renderWho(){
 const all=[[me,myName+' (you)'],...Object.entries(names)];
 $('who').innerHTML=all.map(([p,n])=>`<span class="p ${speaking[p]?'sp':''}">${esc(n)}</span>`).join('');
 $('st').textContent=all.length+' in call';
}
function addLine(l){
 const d=document.createElement('div');d.className='l';
 d.innerHTML='<span class="t"></span><b></b> <span></span>';
 d.children[0].textContent=l.time;d.children[1].textContent=l.name+':';d.children[2].textContent=l.text;
 if(l.original&&l.original!==l.text){const o=document.createElement('div');o.className='o';o.textContent=l.original;d.appendChild(o);}
 if(l.cards)l.cards.forEach(k=>{const x=document.createElement('div');x.className='cd';x.innerHTML=cardHtml(k);d.appendChild(x);});
 $('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;
}
const sig=(to,kind,payload)=>ws.send(JSON.stringify({type:'sig',to,kind,payload}));

function mkPc(peer,initiator){
 if(pcs[peer])return pcs[peer];
 const pc=new RTCPeerConnection({iceServers:ICE});pcs[peer]=pc;
 stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.onicecandidate=e=>{if(e.candidate)sig(peer,'ice',e.candidate.toJSON());};
 pc.ontrack=e=>{let a=document.getElementById('a'+peer);
  if(!a){a=document.createElement('audio');a.id='a'+peer;a.autoplay=true;a.playsInline=true;$('audio').appendChild(a);}
  a.srcObject=e.streams[0];};
 if(initiator)pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sig(peer,'offer',pc.localDescription.toJSON()));
 return pc;
}
function drop(p){if(pcs[p]){try{pcs[p].close()}catch(_){}delete pcs[p];}
 const a=document.getElementById('a'+p);if(a)a.remove();delete names[p];renderWho();}

// ---- cut my own microphone into short clips and send them to the server ----
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let analyser=null,abuf=null,noise=0.01;
function level(){analyser.getByteTimeDomainData(abuf);let m=0;
 for(let i=0;i<abuf.length;i++){const v=Math.abs(abuf[i]-128)/128;if(v>m)m=v;}return m;}
async function startLoop(){
 try{const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();await ctx.resume();
  analyser=ctx.createAnalyser();analyser.fftSize=1024;abuf=new Uint8Array(analyser.fftSize);
  ctx.createMediaStreamSource(stream).connect(analyser);}
 catch(_){$('vs').textContent='Voice typing could not start on this browser.';return;}
 const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
 if(!mime){$('vs').textContent='This browser cannot record audio. Use Chrome.';return;}
 $('vs').textContent='Voice typing ON - speak normally';
 while(running){
  const chunks=[];const rc=new MediaRecorder(stream,{mimeType:mime});
  rc.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  const done=new Promise(r=>rc.onstop=r);
  rc.start();const t0=Date.now();let voiced=0,quiet=0;
  while(running){
   await sleep(100);
   const lv=level(),thr=Math.max(0.04,noise*2.5),talk=!muted&&lv>thr;
   if(!talk)noise=noise*0.95+lv*0.05;          // learn the background noise level
   if(talk){voiced+=100;quiet=0;}else quiet+=100;
   const el=Date.now()-t0;
   if(el>=15000)break;                       // never longer than 15 s
   if(el>=6000&&quiet>=900)break;            // cut at a natural pause
   if(voiced===0&&el>=4000)break;            // nobody talking: restart
  }
  rc.stop();await done;
  if(voiced>=1200&&ws.readyState===1){
   const blob=new Blob(chunks,{type:mime});
   ws.send(await blob.arrayBuffer());
   $('vs').textContent='Voice typing ON - sending...';
   setTimeout(()=>{if(running)$('vs').textContent='Voice typing ON - speak normally';},2500);
  }
 }
}

$('join').onclick=async()=>{
 myName=$('nm').value.trim();room=$('room').value.trim()||'team';pass=$('pass').value;
 if(!myName){$('nm').focus();return;}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
 catch(_){$('err').textContent='Please allow the microphone.';return;}
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>ws.send(JSON.stringify({type:'join',room,name:myName,pass,lang:$('lang').value}));
 ws.onmessage=async ev=>{const m=JSON.parse(ev.data);
  if(m.type==='error'){$('err').textContent=m.msg;stream.getTracks().forEach(t=>t.stop());ws.close();return;}
  if(m.type==='welcome'){me=m.id;m.peers.forEach(p=>names[p.id]=p.name);
   $('lobby').hidden=true;$('call').hidden=false;m.lines.forEach(addLine);running=true;renderWho();startLoop();refreshSap();}
  else if(m.type==='peer-join'){names[m.id]=m.name;renderWho();mkPc(m.id,true);}
  else if(m.type==='peer-left')drop(m.id);
  else if(m.type==='note')$('vs').textContent=m.msg;
  else if(m.type==='line'){addLine(m);speaking[m.id]=true;renderWho();setTimeout(()=>{speaking[m.id]=false;renderWho();},1500);}
  else if(m.type==='sig'){const pc=mkPc(m.from,false);
   try{if(m.kind==='offer'){await pc.setRemoteDescription(m.payload);const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(m.from,'answer',pc.localDescription.toJSON());}
   else if(m.kind==='answer')await pc.setRemoteDescription(m.payload);
   else if(m.kind==='ice')await pc.addIceCandidate(m.payload);}catch(_){}}
 };
 ws.onclose=()=>{if(running)$('st').textContent='Connection lost. Reload the page to rejoin.';};
};
$('mute').onclick=()=>{muted=!muted;stream.getAudioTracks().forEach(t=>t.enabled=!muted);
 $('mute').textContent=muted?'Unmute mic':'Mute mic';$('mute').classList.toggle('on',muted);};
$('leave').onclick=()=>{running=false;recOn=false;try{rec&&rec.stop()}catch(_){}Object.keys(pcs).forEach(drop);
 stream.getTracks().forEach(t=>t.stop());ws.close();$('st').textContent='You left. You can still save the transcript.';$('vs').textContent='';
 $('leave').disabled=true;$('mute').disabled=true;};

// ---------- SAP part cards, lookup and day-end check ----------
const nf=v=>v==null?'-':(Math.round(v*100)/100);
function cardHtml(c){
 let h='<b>'+esc(c.code)+'</b> '+esc(c.name)+'<br>FG stock '+nf(c.inStock)+' | Stock+Prod '+nf(c.stkPrd)+' | Planned '+nf(c.pln)+' | Released '+nf(c.rel)+' | In prod '+nf(c.prd)+' | Sales orders '+nf(c.so)+' | Trigger '+nf(c.tri)+' | Min '+nf(c.min)+' Max '+nf(c.max)+' Bin '+nf(c.bin);
 if(c.plannedNos)h+='<br>Planned order no: '+esc(c.plannedNos);
 if(c.releasedNos)h+='<br>Released order no: '+esc(c.releasedNos);
 if(!c.orders.length)h+='<br>No open WIP order.';
 c.orders.slice(0,5).forEach(o=>{h+='<br>Order '+esc(o.ord)+' ('+esc(o.ordDt)+'): plan '+nf(o.plan)+', done '+nf(o.com)+', open '+nf(o.open)+' - '+Object.keys(o.stages).map(s=>s+' '+o.stages[s].cp+'/'+o.stages[s].pl+(o.stages[s].done?' ✔':' ✘')).join(', ');});
 if(c.orders.length>5)h+='<br>+'+(c.orders.length-5)+' more orders';
 return h;}
const qs=()=>'room='+encodeURIComponent(room)+'&key='+encodeURIComponent(pass);
function showSap(st){$('sapst').textContent='Orders: '+(st.ordersCount?st.ordersCount+' items ('+st.ordersAt+')':'not uploaded')+' | WIP: '+(st.wipCount?st.wipCount+' rows ('+st.wipAt+')':'not uploaded');}
async function refreshSap(){try{showSap(await (await fetch('/sapstatus?'+qs())).json());}catch(_){}}
async function sendFile(file,kind){
 if(!file)return;$('sapst').textContent='Reading '+file.name+'...';
 try{
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
  const r=await fetch('/upload?'+qs()+'&kind='+kind,{method:'POST',body:JSON.stringify(rows)});
  if(!r.ok)throw new Error(await r.text());showSap(await r.json());
 }catch(e){$('sapst').textContent='Upload failed: '+e.message;}
}
$('uo').onclick=()=>$('fo').click();$('uw').onclick=()=>$('fw').click();
$('fo').onchange=e=>{sendFile(e.target.files[0],'orders');e.target.value='';};
$('fw').onchange=e=>{sendFile(e.target.files[0],'wip');e.target.value='';};
$('pl').onclick=async()=>{
 const code=$('pq').value.trim();if(!code)return;
 try{const j=await (await fetch('/part?'+qs()+'&code='+encodeURIComponent(code))).json();showSap(j.status);
  $('pc').innerHTML=j.card?'<div class="cd">'+cardHtml(j.card)+'</div>':'<div class="s">Part not found in the uploaded files.</div>';
 }catch(_){$('pc').textContent='Lookup failed.';}
};

const STG=['CUT','BEND','WELD','OS','PC','ASSY','PCK'];
const SRX={CUT:/\b(cut|cutting|laser)\b/i,BEND:/\b(bend|bending)\b/i,WELD:/\bweld/i,OS:/\boutsourc/i,PC:/\b(pc|powder)\b/i,ASSY:/\b(assy|assembly|assemble|assembled)\b/i,PCK:/\b(pack|packing|packed|pck)\b/i};
let dayRows=[];
const NW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,thirty:30,forty:40,fifty:50,hundred:100};
function guess(p){
 const all=p.lines.map(l=>l.text).join(' ');
 let stage='';for(const s of STG)if(SRX[s].test(all)){stage=s;break;}
 const m=all.match(/\b(\d{1,5}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty|thirty|forty|fifty|hundred)[\s-]*(nos?|numbers?|pcs|pieces|units?)\b/i);
 const neg=/\b(not|pending|balance|yet|short)\b/i.test(all),dn=/\b(complet\w*|finish\w*|done|over)\b/i.test(all);
 return {stage,plan:m?String(NW[m[1].toLowerCase()]||m[1]):'',phys:neg?'No':(dn?'Yes':'')};
}
function evalRow(card,stage){
 if(!stage)return {txt:'Choose the process',ok:null};
 const rel=card.orders.filter(o=>o.stages[stage]);
 if(!rel.length)return {txt:'No open order with '+stage,ok:null};
 const det=rel.map(o=>'Ord '+o.ord+': '+o.stages[stage].cp+'/'+o.stages[stage].pl).join('; ');
 return rel.some(o=>!o.stages[stage].done)?{txt:'SAP entry pending ('+det+')',ok:false}:{txt:'SAP entry done ('+det+')',ok:true};
}
function flagOf(phys,ev){
 if(phys==='Yes')return ev.ok===true?['OK','f-ok']:ev.ok===false?['DO SAP ENTRY','f-bad']:['Check',''];
 if(phys==='No')return ['Not completed','f-bad'];return ['Not said',''];
}
function drawDay(){
 let h='<table class="dt"><tr><th>Part</th><th>Description</th><th>Process</th><th>Plan qty</th><th>Physical done</th><th>SAP entry (completed lines vs planned lines)</th><th>Result</th><th>Said on call</th></tr>';
 dayRows.forEach((r,i)=>{
  const ev=evalRow(r.card,r.stage),f=flagOf(r.phys,ev);r.ev=ev.txt;r.flag=f[0];
  h+='<tr><td>'+esc(r.card.code)+'</td><td>'+esc(r.card.name)+'</td><td><select data-i="'+i+'" data-k="stage"><option value=""></option>'+STG.map(s=>'<option'+(s===r.stage?' selected':'')+'>'+s+'</option>').join('')+'</select></td>'
  +'<td><input data-i="'+i+'" data-k="plan" value="'+esc(r.plan)+'" size="4"></td>'
  +'<td><select data-i="'+i+'" data-k="phys">'+['','Yes','No'].map(v=>'<option value="'+v+'"'+(v===r.phys?' selected':'')+'>'+(v||'Not said')+'</option>').join('')+'</select></td>'
  +'<td>'+esc(ev.txt)+'</td><td class="'+f[1]+'">'+f[0]+'</td><td>'+esc(r.said)+'</td></tr>';
 });
 $('de').innerHTML=h+'</table>';
 $('de').querySelectorAll('[data-i]').forEach(el=>el.onchange=()=>{dayRows[el.dataset.i][el.dataset.k]=el.value;drawDay();});
}
$('de0').onclick=async()=>{
 try{
  const j=await (await fetch('/dayend?'+qs())).json();showSap(j.status);$('dec').hidden=false;
  if(!j.parts.length){$('de').innerHTML='<div class="s">No part numbers from the SAP files were mentioned on this call yet. Upload the SAP files first, then speak part numbers.</div>';dayRows=[];return;}
  dayRows=j.parts.map(p=>{const g=guess(p);const last=p.lines[p.lines.length-1];return {card:p.card,stage:g.stage,plan:g.plan,phys:g.phys,said:p.lines.map(l=>l.time+' '+l.name+': '+l.text).join(' | ')};});
  drawDay();
 }catch(_){$('dec').hidden=false;$('de').textContent='Day-end check failed.';}
};
$('dx').onclick=()=>{
 let t='<html><head><meta charset="utf-8"></head><body><table border="1"><tr><th>Part</th><th>Description</th><th>Process</th><th>Plan qty</th><th>Physical done</th><th>SAP entry</th><th>Result</th><th>Said on call</th></tr>';
 dayRows.forEach(r=>t+='<tr><td>'+esc(r.card.code)+'</td><td>'+esc(r.card.name)+'</td><td>'+esc(r.stage)+'</td><td>'+esc(r.plan)+'</td><td>'+esc(r.phys||'Not said')+'</td><td>'+esc(r.ev)+'</td><td>'+esc(r.flag)+'</td><td>'+esc(r.said)+'</td></tr>');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(["\ufeff"+t+'</table></body></html>'],{type:'application/vnd.ms-excel'}));
 a.download='day_end_check_'+new Date().toISOString().slice(0,10)+'.xls';document.body.appendChild(a);a.click();a.remove();
};

const dlurl=f=>`/export?room=${encodeURIComponent(room)}&fmt=${f}&key=${encodeURIComponent(pass)}`;
async function loadDay(){
 const j=await (await fetch('/dayend?'+qs())).json();
 return j.parts.map(p=>{const g=guess(p);return {card:p.card,stage:g.stage,plan:g.plan,phys:g.phys,said:p.lines.map(l=>l.time+' '+l.name+': '+l.text).join(' | ')};});
}
$('xls').onclick=async()=>{
 const b=$('xls'),old=b.textContent;b.textContent='Preparing...';
 try{
  const t=await (await fetch('/exportdata?'+qs())).json();
  if(!dayRows.length)dayRows=await loadDay();      // use your edits if you opened Day-end check
  const wb=XLSX.utils.book_new();
  const w1=XLSX.utils.aoa_to_sheet([t.head,...t.rows]);
  w1['!cols']=[6,11,9,14,50,40,12,28,9,10,9,9,9,10,8,38,50].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,w1,'Transcript');
  const dh=['Part','Description','Process','Plan qty','Physical done','SAP entry (completed lines vs planned lines)','Result','Said on call'];
  const dr=dayRows.map(r=>{const ev=evalRow(r.card,r.stage),f=flagOf(r.phys,ev);return [r.card.code,r.card.name,r.stage,r.plan,r.phys||'Not said',ev.txt,f[0],r.said];});
  const w2=XLSX.utils.aoa_to_sheet([dh,...dr]);
  w2['!cols']=[12,28,9,9,13,55,15,70].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,w2,'Day-end check');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download='call_'+room+'_'+t.date+'.xlsx';document.body.appendChild(a);a.click();a.remove();
 }catch(e){alert('Could not prepare the Excel file: '+e.message);}
 b.textContent=old;
};
$('doc').onclick=()=>location.href=dlurl('doc');
</script></body></html>
